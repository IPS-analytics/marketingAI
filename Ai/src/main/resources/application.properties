spring.application.name=kotler

# Секреты — из env (.env локально / Variables на Render)
# Render Postgres URL ОБЯЗАТЕЛЬНО в виде:
#   jdbc:postgresql://HOST:5432/DBNAME?sslmode=require
# Не вставляйте postgresql://... без префикса jdbc:
# Host берите Internal (если API и БД в одном Render), иначе External.

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/kotlerdb}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Render задаёт PORT; локально можно SERVER_PORT
server.port=${PORT:${SERVER_PORT:8080}}

token.signing.key=${TOKEN_SIGNING_KEY}
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:3600000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

deepseek.api.url=${DEEPSEEK_API_URL:https://api.deepseek.com/chat/completions}
deepseek.api.key=${DEEPSEEK_API_KEY:}
deepseek.model=${DEEPSEEK_MODEL:deepseek-chat}
